# DramaFlow 反向代理 —— 完整 nginx.conf（适配 Debian/Ubuntu 的 /etc/nginx/nginx.conf）
#
# 用法：
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
#   sudo cp deploy/nginx.conf /etc/nginx/nginx.conf
#   sudo sed -i 's/dramaflow.example.com/你的域名/g' /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（首次，nginx 未占用 80 端口时）：
#   sudo certbot certonly --standalone -d 你的域名 --email you@example.com --agree-tos
# 续期（standalone 会短暂占用 80，用钩子停/起 nginx）：
#   sudo certbot renew --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#
# 前提：云防火墙只开 22/80/443；应用只监听 127.0.0.1:8000。

# user www-data;            # Debian/Ubuntu 默认；官方容器镜像里没有该用户，按需启用
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 素材上传上限；超过会被 413 拒绝。
    client_max_body_size 512m;

    # 只压缩普通文本。text/event-stream、application/x-ndjson 不在列表里，
    # 且下面的流式 location 再显式 gzip off，避免压缩把事件攒成大块。
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream dramaflow_app {
        server 127.0.0.1:8000;
        keepalive 32;          # 复用上游连接，流式请求不用每次握手
    }

    # —— HTTP：只做 ACME 校验与跳转 ——
    server {
        listen 80;
        listen [::]:80;
        server_name dramaflow.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # —— HTTPS ——
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;              # nginx < 1.25.1 请改成 listen 443 ssl http2;
        server_name dramaflow.example.com;

        ssl_certificate     /etc/letsencrypt/live/dramaflow.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dramaflow.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # —— 流式接口：/api/agent、/api/agent/*、/api/team、/api/team/*、/api/events/stream ——
        # 响应是 application/x-ndjson，逐个事件下发。任何响应缓冲或压缩都会让前端"卡住不更新"。
        location ~ ^/api/(agent|team)(/|$)|^/api/events/stream$ {
            proxy_pass http://dramaflow_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";        # 清空 close，配合 upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;                   # 核心：不把响应攒在 nginx
            proxy_cache off;
            proxy_request_buffering off;           # 请求体直传，长提示词不必等收全
            proxy_connect_timeout 10s;
            proxy_read_timeout 900s;               # Agent 可能跑几分钟，默认 60s 会断
            proxy_send_timeout 900s;
            gzip off;                              # 压缩会聚合数据，必须关
        }

        # —— 普通接口、前端静态资源、素材 ——
        location / {
            proxy_pass http://dramaflow_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # —— WebSocket（当前未使用，留给将来的实时通道）——
        location /ws {
            proxy_pass http://dramaflow_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}
